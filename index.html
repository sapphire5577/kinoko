<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>みんなのキノコ作戦会議</title>
<style>
  :root {
    --bg:#fffaf0; --card:#ffffff; --ink:#3d3328; --muted:#897b6b;
    --accent:#c86f28; --line:#eadfce; --ok:#4d8b61;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { touch-action:manipulation; }
  body { margin:0; background:linear-gradient(#fffdf8,#fff7e9); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; }
  button,input { font:inherit; }
  .wrap { max-width:720px; margin:auto; padding:18px 14px 42px; }
  .hero { background:#fff; border:2px solid var(--line); border-radius:24px; padding:10px 10px 16px;
    box-shadow:0 8px 28px rgba(80,55,25,.08); text-align:center; }
  .hero img { width:100%; max-height:360px; object-fit:contain; border-radius:18px; display:block; background:#fff; }
  .credit { font-size:18px; color:#8b7d70; margin-top:7px; }
  h1 { font-size:36px; margin:17px 4px 5px; letter-spacing:.03em; }
  .sub { color:var(--muted); font-size:19.5px; margin:0 4px 8px; }
  .panel { background:var(--card); border:2px solid var(--line); border-radius:20px; padding:16px;
    margin-top:14px; box-shadow:0 5px 18px rgba(80,55,25,.05); }
  .panel h2 { margin:0 0 12px; font-size:27px; }
  .choices { display:grid; grid-template-columns:1fr 1fr; gap:9px; }
  .choice { border:2px solid var(--line); background:#fffaf4; border-radius:14px; padding:11px 9px;
    text-align:left; min-height:48px; color:var(--ink); }
  .choice.selected { border:3px solid var(--accent); background:#fff1df; padding:10px 8px; }
  .choice:active { transform:scale(.985); }
  .members { display:grid; gap:9px; }
  .member { border-top:1px dashed var(--line); padding-top:9px; }
  .member:first-child { border-top:0; padding-top:0; }
  .member-name { font-weight:700; font-size:21px; margin-bottom:4px; }
  .tags { display:flex; flex-wrap:wrap; gap:6px; }
  .tag { display:inline-flex; align-items:center; background:#f8efe2; border-radius:999px; padding:5px 9px; font-size:19.5px; }
  .empty { color:#a79a8c; font-size:19.5px; }
  .status { min-height:22px; color:var(--ok); font-weight:700; font-size:19.5px; margin-top:9px; }
  .topbar { display:flex; gap:8px; align-items:center; justify-content:space-between; margin:14px 2px 0; }
  .room { font-size:18px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .btn { border:0; border-radius:13px; padding:10px 13px; background:var(--accent); color:#fff; font-weight:700; }
  .btn.secondary { background:#f0e7da; color:var(--ink); }
  .notice { background:#fff8dd; border:2px solid #efdf9f; border-radius:14px; padding:11px 12px;
    font-size:19.5px; line-height:1.55; }
  input[type=text] { width:100%; border:2px solid var(--line); border-radius:13px; padding:11px 12px; outline:none; }
  .nameRow { display:grid; grid-template-columns:1fr auto; gap:8px; }
  .hidden { display:none!important; }
  .small { font-size:18px; color:var(--muted); line-height:1.5; }
  @media (min-width:560px) { .choices { grid-template-columns:repeat(3,1fr); } }

  .emoji-rain {
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:9999;
  }
  .emoji-rain span {
    position:absolute; top:-3rem; left:0;
    display:block; font-size:clamp(24px,7vw,46px);
    will-change:transform,opacity;
    animation:emojiFall linear forwards;
    text-shadow:0 2px 6px rgba(60,40,20,.14);
  }
  @keyframes emojiFall {
    0% { transform:translate3d(0,-8vh,0) rotate(0deg); opacity:0; }
    8% { opacity:1; }
    88% { opacity:1; }
    100% { transform:translate3d(var(--drift),112vh,0) rotate(var(--rot)); opacity:0; }
  }


  .flower-note {
    border:2px solid var(--line);
    border-radius:14px;
    padding:11px 12px;
    margin:-2px 0 11px;
    background:#fffaf4;
    font-weight:700;
    text-align:center;
  }
</style>
</head>

import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-database.js";

const configured = true;
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

const mushrooms = [
  "🍄 ふつうのイベントキノコ","🍄⭐️ 巨大キノコ","🔥 火のキノコ","💧 水のキノコ",

];

const people = [
  { id: "frank", label: "フランク" },
  { id: "catherine", label: "キャサリン" },
  { id: "dollar", label: "$$$" }
];
const personById = Object.fromEntries(people.map(p => [p.id, p]));

const params = new URLSearchParams(location.search);
let roomId = params.get("room");
let me = localStorage.getItem("kinoko_person_id") || "";
if (!personById[me]) {
  // 旧版の保存値が残っている場合は、誤操作を防ぐため一度選び直してもらう。
  me = "";
  localStorage.removeItem("kinoko_person_id");
}
let state = { mushroom: {}, items: {}, activities: {}, texts: {} };
let unsubscribe = null;

function roomPath() { return ref(db, "rooms/" + roomId); }
function categoryPath(type, person=me) { return ref(db, "rooms/" + roomId + "/" + type + "/" + person); }
function textPath(person=me) { return ref(db, "rooms/" + roomId + "/texts/" + person); }

function renderChoices(id, list, type, multi=false) {
  const el = document.getElementById(id);
  el.innerHTML = "";
  list.forEach(v => {
    const b = document.createElement("button");
    b.className = "choice";
    const selected = multi ? (state[type]?.[me]?.includes(v)) : state[type]?.[me] === v;
    if (selected) b.classList.add("selected");
    b.textContent = v;
    b.onclick = () => selectValue(type, v, multi);
    el.appendChild(b);
  });
}

function memberBlock(type, containerId, multi=false) {
  const el = document.getElementById(containerId);
  el.innerHTML = "";
  people.forEach(person => {
    const p = person.id;
    const row = document.createElement("div");
    row.className = "member";

    const n = document.createElement("div");
    n.className = "member-name";
    n.textContent = person.label;

    const tags = document.createElement("div");
    tags.className = "tags";

    let vals = state[type]?.[p];
    if (!Array.isArray(vals)) vals = vals ? [vals] : [];

    if (type === "activities" && state.texts?.[p]) {
      vals = vals.concat("🖊️ 「" + state.texts[p] + "」");
    }

    if (!vals.length) {
      const e = document.createElement("span");
      e.className = "empty";
      e.textContent = "まだ選択なし";
      tags.appendChild(e);
    } else {
      vals.forEach(v => {
        const t = document.createElement("span");
        t.className = "tag";
        t.textContent = v;
        tags.appendChild(t);
      });
    }

    row.append(n, tags);
    el.appendChild(row);
  });
}

async function selectValue(type, value, multi) {
  if (!roomId || !me) return;

  let next;
  if (multi) {
    const current = Array.isArray(state[type]?.[me]) ? [...state[type][me]] : [];
    const i = current.indexOf(value);
    i >= 0 ? current.splice(i, 1) : current.push(value);
    next = current;
  } else {
    next = value;
  }

  state[type] ||= {};
  state[type][me] = next;

  // 自分の項目だけを書き込むので、別端末の同時操作を潰さない。
  await set(categoryPath(type), next);

  const statusId =
    type === "mushroom" ? "mushroomStatus" :
    type === "items" ? "itemStatus" : "activityStatus";

  document.getElementById(statusId).textContent = "共有されたよ！";

  if (type === "activities") {
    document.getElementById("freeTextBox").classList.toggle(
      "hidden",
      !(state.activities?.[me] || []).includes("🖊️ 自分の言葉で書く")
    );
  }
}

async function saveText() {
  const v = document.getElementById("freeText").value.trim().slice(0, 10);
  if (!v || !roomId || !me) return;

  state.texts ||= {};
  state.texts[me] = v;

  await set(textPath(), v);
  document.getElementById("activityStatus").textContent = "共有されたよ！";
  document.getElementById("freeText").value = "";
}

function renderAll() {
  renderChoices("mushroomChoices", mushrooms, "mushroom", false);
  renderChoices("itemChoices", items, "items", true);
  renderChoices("activityChoices", activities, "activities", true);

  memberBlock("mushroom", "mushroomMembers");
  memberBlock("items", "itemMembers", true);
  memberBlock("activities", "activityMembers", true);

  document.getElementById("freeTextBox").classList.toggle(
    "hidden",
    !(state.activities?.[me] || []).includes("🖊️ 自分の言葉で書く")
  );
}

function joinAs(name) {
  me = name;
  localStorage.setItem("kinoko_person_id", name);

  if (!roomId) {
    roomId = crypto.randomUUID().replaceAll("-", "").slice(0, 10);
    history.replaceState(null, "", "?room=" + roomId);
  }

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("roomLabel").textContent = "共有ルーム：" + roomId + " ／ " + (personById[me]?.label || me);

  if (unsubscribe) unsubscribe();

  // 部屋全体を監視。オンライン状況・接続状況は一切表示しない。
  unsubscribe = onValue(roomPath(), snap => {
    state = snap.val() || { mushroom: {}, items: {}, activities: {}, texts: {} };
    renderAll();
  });
}

function dropMushroomEmojis() {
  const layer = document.getElementById("emojiRain");
  if (!layer) return;

  const emojis = ["🍄", "⭐️", "🍀", "✨", "💖"];
  const count = 24;

  for (let i = 0; i < count; i++) {
    const s = document.createElement("span");
    s.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    s.style.left = (Math.random() * 100) + "vw";
    s.style.setProperty("--drift", ((Math.random() - 0.5) * 30) + "vw");
    s.style.setProperty("--rot", ((Math.random() - 0.5) * 80) + "deg");
    s.style.animationDuration = (2.3 + Math.random() * 1.9).toFixed(2) + "s";
    s.style.animationDelay = (Math.random() * 0.38).toFixed(2) + "s";
    layer.appendChild(s);

    const lifetime = 4800;
    setTimeout(() => s.remove(), lifetime);
  }
}

const heroImage = document.querySelector(".hero img");
if (heroImage) {
  heroImage.addEventListener("click", dropMushroomEmojis);
}

window.joinAs = joinAs;

window.shareRoom = async function() {
  const url = location.href;

  if (navigator.share) {
    try {
      await navigator.share({
        title: "みんなのキノコ作戦会議",
        text: "共有ルームに参加してね",
        url
      });
    } catch (e) {
      // キャンセル時は何もしない
    }
  } else {
    try {
      await navigator.clipboard.writeText(url);
      alert("共有リンクをコピーしたよ！");
    } catch (e) {
      prompt("このリンクをコピーして送ってね", url);
    }
  }
};

window.saveText = saveText;

if (me && roomId) {
  joinAs(me);
}
</script>
